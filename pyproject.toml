[project]
name = "firefox-releases"
version = "0.1.0"
description = "List Firefox releases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "requests>=2.34.2",
]
authors = [
    { name = "Sandip Bhattacharya", email = "sandipb@showmethesource.org" }
]
license = "Apache-2.0"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pre-commit>=4.7.0",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
]

[project.urls]
"Homepage" = "https://github.com/sandipb/firefox-releases"
"Repository" = "https://github.com/sandipb/firefox-releases"
