# Taskfile.yaml
version: "3"

includes:
  fixtures:
    taskfile: ./firefox_releases/testdata/Taskfile.yaml
    dir: ./firefox_releases/testdata

vars:
  DOCS_URL: "firefox-releases.foss-community.org"
  OUTPUT_DIR: public

tasks:
  announce:
    desc: Run release announcements (requires configured credentials and destination)
    cmds:
      - uv run python -m firefox_releases.announcements {{.CLI_ARGS}}

  generate:
    desc: Generate RSS, HTML and JSON files for latest Firefox releases
    cmds:
      - mkdir -p "{{.OUTPUT_DIR}}"
      - echo "{{ .DOCS_URL }}" > "{{.OUTPUT_DIR}}/CNAME"
      - uv run ./generate.py -o "{{.OUTPUT_DIR}}" -n 30

  test:
    desc: Run tests using pytest
    cmds:
      - uv run pytest firefox_releases
  lint:
    desc: Check Python lint and formatting with Ruff
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
  format:
    desc: Format Python code with Ruff
    cmds:
      - uv run ruff format .
  pre-commit:
    desc: Run pre-commit hooks on all files
    cmds:
      - uv run pre-commit run --all-files
  clean:
    desc: Clean up generated files in the public directory
    cmds:
      - rm -rf public
  deploy:
    desc: Deploy the project by triggering the generate-rss workflow on GitHub Actions
    cmds:
      - gh workflow run generate-rss.yaml
  all:
    desc: Run local checks
    cmds:
      - task pre-commit

  venv:
    desc: Sync the virtual environment with the lockfile
    cmds:
      - uv sync --locked

  act:
    desc: Run the GitHub Actions locally using act
    cmds:
      - |
        GHTOKEN=$(gh auth token)
        act workflow_dispatch \
          -P ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest \
          --container-architecture=linux/arm64 \
          --pull=false \
          -s GITHUB_TOKEN="$GHTOKEN"

  serve:
    desc: Serve the generated files using uv
    cmds:
      - uv run python -m http.server --directory public
