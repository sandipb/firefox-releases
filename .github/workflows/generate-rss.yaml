name: generate-rss

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.53.1

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: task test

      - name: Generate RSS, HTML and JSON
        run: |
          mkdir -p public
          task generate

      - name: Warn when feed is unavailable
        if: ${{ hashFiles('public/index.xml') == '' }}
        run: echo '::warning::No release data; keeping the last published site'

      - name: Publish to ghpages
        if: ${{ hashFiles('public/index.xml') != '' }}
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
